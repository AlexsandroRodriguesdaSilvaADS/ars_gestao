<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARS Sistem — Gestão de Oficina Mecânica</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#172033',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>

</head>

<body class="bg-slate-950 text-slate-200 antialiased selection:bg-blue-600 selection:text-white">

    <!-- ===================================================================== -->
    <!-- CONTAINER PRINCIPAL DA APLICAÇÃO (OCULTO NA IMPRESSÃO)                -->
    <!-- ===================================================================== -->
    <div id="app-shell" class="min-h-screen flex flex-col">

        <!-- BARRA SUPERIOR / NAVBAR -->
        <header
            class="bg-slate-900/95 backdrop-blur-md text-white shadow-lg shadow-black/20 sticky top-0 z-30 border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3 gap-3">

                    <!-- Logo & Identidade da Oficina -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('patio')">
                            <div class="bg-blue-600 p-2.5 rounded-xl shadow-inner shadow-blue-400/30">
                                <i class="fa-solid fa-wrench text-xl text-white"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h1 class="text-lg font-extrabold tracking-tight text-white">ARS <span
                                            class="text-blue-400">ERP</span></h1>
                                    <span
                                        class="text-[10px] font-bold uppercase tracking-wider bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">v2.6</span>
                                </div>
                                <p class="text-xs text-slate-400" id="header-workshop-name">Centro Automotivo &
                                    Diagnóstico</p>
                            </div>
                        </div>

                        <!-- Botão Mobile Rápido Novo Check-in -->
                        <button onclick="openCheckinModal()"
                            class="md:hidden bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-plus"></i> Check-in
                        </button>
                    </div>

                    <!-- Busca Global & Ações Rápidas -->
                    <div class="flex flex-1 max-w-xl items-center gap-2">
                        <div class="relative flex-1">
                            <i
                                class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" id="global-search" oninput="handleGlobalSearch(this.value)"
                                placeholder="Buscar por placa (ABC-1234), cliente, CPF ou nº da OS..."
                                class="w-full bg-slate-800 text-sm text-white placeholder-slate-400 pl-10 pr-8 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                            <button id="clear-search-btn" onclick="clearGlobalSearch()"
                                class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
                                <i class="fa-solid fa-circle-xmark"></i>
                            </button>
                        </div>

                        <!-- Botão de Alternar Perfil Financeiro -->
                        <button id="profile-toggle-btn" onclick="toggleFinancialProfile()"
                            title="Alternar Visibilidade Financeira"
                            class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition text-white">
                            <!-- Ícone injetado via JS -->
                        </button>

                        <button onclick="openCheckinModal()"
                            class="hidden md:flex bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-md shadow-blue-950/50 items-center gap-2 transition whitespace-nowrap">
                            <i class="fa-solid fa-car-side"></i> Novo Check-in
                        </button>
                    </div>

                </div>
            </div>
        </header>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            <!-- KPIs / INDICADORES EM TEMPO REAL -->
            <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                <!-- KPI 1: Veículos no Pátio -->
                <div onclick="switchTab('patio')"
                    class="bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-800 hover:border-blue-500/50 cursor-pointer transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Veículos no
                            Pátio</span>
                        <div
                            class="w-9 h-9 rounded-xl bg-slate-800 text-slate-300 group-hover:bg-blue-500/20 group-hover:text-blue-400 flex items-center justify-center transition">
                            <i class="fa-solid fa-warehouse"></i>
                        </div>
                    </div>
                    <div class="flex items-baseline gap-2">
                        <span id="kpi-patio" class="text-2xl sm:text-3xl font-extrabold text-white">0</span>
                        <span class="text-xs text-slate-400">ativos</span>
                    </div>
                </div>

                <!-- KPI 2: Aguardando Diagnóstico -->
                <div onclick="switchTab('diagnostico')"
                    class="bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-800 hover:border-amber-500/50 cursor-pointer transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Em
                            Diagnóstico</span>
                        <div class="w-9 h-9 rounded-xl bg-amber-500/15 text-amber-400 flex items-center justify-center">
                            <i class="fa-solid fa-stethoscope"></i>
                        </div>
                    </div>
                    <div class="flex items-baseline gap-2">
                        <span id="kpi-diagnostico" class="text-2xl sm:text-3xl font-extrabold text-amber-400">0</span>
                        <span class="text-xs text-slate-400">aguardando laudo</span>
                    </div>
                </div>

                <!-- KPI 3: OS em Execução -->
                <div onclick="switchTab('os')"
                    class="bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-800 hover:border-blue-500/50 cursor-pointer transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">OS em
                            Execução</span>
                        <div class="w-9 h-9 rounded-xl bg-blue-500/15 text-blue-400 flex items-center justify-center">
                            <i class="fa-solid fa-gears"></i>
                        </div>
                    </div>
                    <div class="flex items-baseline gap-2">
                        <span id="kpi-os" class="text-2xl sm:text-3xl font-extrabold text-blue-400">0</span>
                        <span class="text-xs text-slate-400">em serviço / peça</span>
                    </div>
                </div>

                <!-- KPI 4: Faturamento Concluído -->
                <div onclick="switchTab('historico')"
                    class="bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-800 hover:border-emerald-500/50 cursor-pointer transition group">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Faturamento
                            Total</span>
                        <div
                            class="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
                            <i class="fa-solid fa-sack-dollar"></i>
                        </div>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span id="kpi-faturamento"
                            class="text-xl sm:text-2xl font-extrabold text-emerald-400 truncate">R$ 0,00</span>
                    </div>
                </div>
            </section>

            <!-- NAVEGAÇÃO POR ABAS DO FLUXO OPERACIONAL & BANCO DE DADOS -->
            <nav
                class="bg-slate-900 p-1.5 rounded-2xl shadow-sm border border-slate-800 flex overflow-x-auto gap-1 no-scrollbar">
                <button data-tab="patio" onclick="switchTab('patio')"
                    class="tab-btn flex-1 min-w-[130px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Visão Pátio</span>
                    <span id="badge-patio"
                        class="bg-slate-800 text-slate-300 text-[11px] px-2 py-0.5 rounded-full">0</span>
                </button>
                <button data-tab="diagnostico" onclick="switchTab('diagnostico')"
                    class="tab-btn flex-1 min-w-[140px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-laptop-medical"></i>
                    <span>2. Diagnóstico</span>
                    <span id="badge-diagnostico"
                        class="bg-amber-500/20 text-amber-300 text-[11px] px-2 py-0.5 rounded-full">0</span>
                </button>
                <button data-tab="os" onclick="switchTab('os')"
                    class="tab-btn flex-1 min-w-[145px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>3. Ordem de Serviço</span>
                    <span id="badge-os"
                        class="bg-blue-500/20 text-blue-300 text-[11px] px-2 py-0.5 rounded-full">0</span>
                </button>
                <button data-tab="checkout" onclick="switchTab('checkout')"
                    class="tab-btn flex-1 min-w-[135px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <span>4. Check-out</span>
                    <span id="badge-checkout"
                        class="bg-purple-500/20 text-purple-300 text-[11px] px-2 py-0.5 rounded-full">0</span>
                </button>
                <button data-tab="historico" onclick="switchTab('historico')"
                    class="tab-btn flex-1 min-w-[120px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Histórico</span>
                </button>
                <button data-tab="database" onclick="switchTab('database')"
                    class="tab-btn flex-1 min-w-[145px] py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-database"></i>
                    <span>Clientes & Banco</span>
                </button>
            </nav>

            <!-- ÁREA DINÂMICA DE CONTEÚDO DAS ABAS -->
            <div id="main-content-area" class="space-y-6">
                <!-- Renderizado dinamicamente via JavaScript -->
            </div>

        </main>

        <!-- RODAPÉ -->
        <footer class="bg-slate-900 border-t border-slate-800 py-4 mt-8">
            <div
                class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-2">
                <p><strong class="text-slate-200">AutoTech ERP</strong> — Persistência Local Ativa (<code
                        class="bg-slate-800 px-1.5 py-0.5 rounded text-blue-400 border border-slate-700">localStorage</code>)
                </p>
                <div class="flex items-center gap-4">
                    <button onclick="openWorkshopSettingsModal()"
                        class="hover:text-blue-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-sliders"></i> Dados da Oficina (Cabeçalho OS)
                    </button>
                    <button onclick="switchTab('database')"
                        class="hover:text-blue-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-download"></i> Backup JSON
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- ===================================================================== -->
    <!-- SISTEMA DE MODAIS (CHECK-IN, DIAGNÓSTICO, OS, CHECK-OUT, CONFIG)      -->
    <!-- ===================================================================== -->
    <div id="modal-backdrop"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
        <div id="modal-box"
            class="bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden my-auto">
            <!-- Header do Modal -->
            <div
                class="bg-slate-950 text-white px-5 py-4 flex items-center justify-between shrink-0 border-b border-slate-800">
                <div class="flex items-center gap-2.5">
                    <i id="modal-icon" class="fa-solid fa-car text-blue-400 text-lg"></i>
                    <h2 id="modal-title" class="text-base sm:text-lg font-bold">Título do Modal</h2>
                </div>
                <button onclick="closeModal()"
                    class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- Corpo do Modal -->
            <div id="modal-body" class="p-4 sm:p-6 overflow-y-auto space-y-5 flex-1 text-slate-200">
                <!-- Conteúdo injetado dinamicamente -->
            </div>
            <!-- Rodapé do Modal -->
            <div id="modal-footer"
                class="bg-slate-850 border-t border-slate-800 px-5 py-3.5 flex flex-wrap items-center justify-end gap-2 shrink-0">
                <!-- Botões injetados dinamicamente -->
            </div>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- NOTIFICAÇÕES TOAST (SUBSTITUI ALERT/CONFIRM NATIVOS)                  -->
    <!-- ===================================================================== -->
    <div id="toast-container"
        class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
    </div>

    <!-- ===================================================================== -->
    <!-- ÁREA EXCLUSIVA PARA IMPRESSÃO FORMATADA A4 (@media print)             -->
    <!-- ===================================================================== -->
    <!--<div id="print-container"></div>-->
    <!-- Contêiner invisível na tela normal, ativado na impressão -->
    <div id="print-container" class="hidden"></div>

    <!-- ===================================================================== -->
    <!-- LÓGICA COMPLETA DO SISTEMA EM JAVASCRIPT PURO                         -->
    <!-- ===================================================================== -->

    <script src="./src/js/index.js"></script>

</body>

</html>
